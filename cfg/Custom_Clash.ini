;==================================================
; Custom OpenClash Rules - 最终稳定版
; 无国家/地区节点分组
; 不再报 group not found
;==================================================

[custom]

;========================
; 规则：局域网 & 私有网络直连
;========================
ruleset=手动选择,[]GEOSITE,private
ruleset=手动选择,[]GEOIP,private,no-resolve

;========================
; 国内直连
;========================
ruleset=手动选择,[]GEOSITE,cn
ruleset=手动选择,[]GEOIP,cn,no-resolve

;========================
; 常用国外服务
;========================
ruleset=自动选择,[]GEOSITE,openai
ruleset=自动选择,[]GEOSITE,github
ruleset=自动选择,[]GEOSITE,youtube
ruleset=自动选择,[]GEOSITE,netflix
ruleset=自动选择,[]GEOSITE,spotify

;========================
; 兜底规则（必须最后）
;========================
ruleset=漏网之鱼,[]FINAL



;==================================================
; 策略组部分（与规则完全匹配）
;==================================================

; 核心组
custom_proxy_group=手动选择`select`
custom_proxy_group=自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=漏网之鱼`select`
