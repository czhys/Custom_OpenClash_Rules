[custom]

;==================================================
; 分流规则 ruleset
;==================================================

; 局域网 & 私有网络直连
ruleset=全球直连,[]GEOSITE,private
ruleset=全球直连,[]GEOIP,private,no-resolve

; 国内网站
ruleset=国内网站,[]GEOSITE,cn
ruleset=国内网站,[]GEOIP,cn,no-resolve

; 广告拦截
ruleset=全球拦截,[]GEOSITE,ads

; PikPak
ruleset=PikPak,[]DOMAIN-KEYWORD,pikpak

; Netflix
ruleset=Netflix,[]GEOSITE,netflix

; YouTube & 国外媒体
ruleset=YouTube,[]GEOSITE,youtube
ruleset=国外媒体,[]GEOSITE,google
ruleset=国外媒体,[]GEOSITE,spotify

; 微软服务
ruleset=微软服务,[]GEOSITE,windows
ruleset=微软服务,[]GEOSITE,microsoft

; 谷歌服务
ruleset=谷歌服务,[]GEOSITE,google

; 苹果服务
ruleset=苹果服务,[]GEOSITE,apple

; 游戏平台 & Steam
ruleset=游戏平台,[]GEOSITE,steam
ruleset=游戏平台,[]GEOSITE,epicgames
ruleset=STEAM,[]GEOSITE,steam

; 兜底
ruleset=漏网之鱼,[]FINAL



;==================================================
; 策略组 proxy-groups
;==================================================

proxy-groups:
  # 手动选择（机场/自建都能用）
  - name: 手动选择
    type: select
    proxies: []

  # 自动选择（测速）
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies: []

  # GitHub
  - name: GitHub
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # chatgpt
  - name: chatgpt
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # AI服务
  - name: AI服务
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # YouTube
  - name: YouTube
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # Netflix
  - name: Netflix
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # 国外媒体
  - name: 国外媒体
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # 微软服务
  - name: 微软服务
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # 谷歌服务
  - name: 谷歌服务
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # 苹果服务
  - name: 苹果服务
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # 游戏平台
  - name: 游戏平台
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # STEAM
  - name: STEAM
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连

  # 全球直连
  - name: 全球直连
    type: select
    proxies:
      - DIRECT

  # 漏网之鱼
  - name: 漏网之鱼
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - 全球直连
