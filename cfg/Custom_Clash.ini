;==================================================
; Custom OpenClash Rules - 完整分流稳定版
;==================================================

[custom]

;========================
; 局域网 & 私有网络直连
;========================
ruleset=全球直连,[]GEOSITE,private
ruleset=全球直连,[]GEOIP,private,no-resolve

;========================
; 国内网站
;========================
ruleset=国内网站,[]GEOSITE,cn
ruleset=国内网站,[]GEOIP,cn,no-resolve

;========================
; 广告拦截
;========================
ruleset=全球拦截,[]GEOSITE,ads

;========================
; PikPak
;========================
ruleset=PikPak,[]DOMAIN-KEYWORD,pikpak

;========================
; Netflix
;========================
ruleset=Netflix,[]GEOSITE,netflix

;========================
; YouTube & 国外网站
;========================
ruleset=YouTube,[]GEOSITE,youtube
ruleset=国外网站,[]GEOSITE,google
ruleset=国外网站,[]GEOSITE,spotify

;========================
; 微软服务
;========================
ruleset=微软服务,[]GEOSITE,windows
ruleset=微软服务,[]GEOSITE,microsoft

;========================
; 谷歌服务
;========================
ruleset=谷歌服务,[]GEOSITE,google

;========================
; 苹果服务
;========================
ruleset=苹果服务,[]GEOSITE,apple

;========================
; 游戏平台 & Steam
;========================
ruleset=游戏平台,[]GEOSITE,steam
ruleset=游戏平台,[]GEOSITE,epicgames
ruleset=Steam,[]GEOSITE,steam

;========================
; 兜底
;========================
ruleset=漏网之鱼,[]FINAL



;==================================================
; 策略组（与规则一一对应）
;==================================================

; 核心选择
custom_proxy_group=手动选择`select`
custom_proxy_group=自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50

; 综合入口（可切换自动/手动/直连）
custom_proxy_group=节点选择`select`[]自动选择[]手动选择[]全球直连

; 分流组
custom_proxy_group=广告拦截`select`[]REJECT[]全球直连
custom_proxy_group=PikPak`select`[]自动选择[]全球直连
custom_proxy_group=Netflix`select`[]自动选择[]全球直连
custom_proxy_group=YouTube`select`[]自动选择[]全球直连
custom_proxy_group=国外网站`select`[]自动选择[]全球直连
custom_proxy_group=国内网站`select`[]全球直连
custom_proxy_group=微软服务`select`[]自动选择[]全球直连
custom_proxy_group=谷歌服务`select`[]自动选择[]全球直连
custom_proxy_group=苹果服务`select`[]自动选择[]全球直连
custom_proxy_group=游戏平台`select`[]自动选择[]全球直连
custom_proxy_group=Steam`select`[]自动选择[]全球直连

; 直连/拦截/兜底
custom_proxy_group=全球直连`select`[]DIRECT
custom_proxy_group=全球拦截`select`[]REJECT
custom_proxy_group=漏网之鱼`select`[]全球直连[]自动选择
