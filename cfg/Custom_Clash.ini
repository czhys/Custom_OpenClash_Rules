;==================================================
; Custom OpenClash Rules - 极简稳定版
; 无国家分组
; PikPak 独立分流
; gamer520 强制直连
;==================================================

[custom]

;========================
; 强制直连（优先级最高）
;========================
ruleset=全球直连,DOMAIN-SUFFIX,gamer520.com

;========================
; PikPak 独立分流
;========================
ruleset=PikPak,DOMAIN-SUFFIX,pikpak.com
ruleset=PikPak,DOMAIN-SUFFIX,mypikpak.com
ruleset=PikPak,DOMAIN-KEYWORD,pikpak

;========================
; 局域网 & 私有网络
;========================
ruleset=全球直连,[]GEOSITE,private
ruleset=全球直连,[]GEOIP,private,no-resolve

;========================
; 国内直连
;========================
ruleset=全球直连,[]GEOSITE,cn
ruleset=全球直连,[]GEOIP,cn,no-resolve

;========================
; 常用国外服务
;========================
ruleset=ChatGPT,[]GEOSITE,openai
ruleset=GitHub,[]GEOSITE,github
ruleset=YouTube,[]GEOSITE,youtube
ruleset=Netflix,[]GEOSITE,netflix
ruleset=Spotify,[]GEOSITE,spotify

;========================
; 兜底规则（必须最后）
;========================
ruleset=漏网之鱼,[]FINAL



;==================================================
; 策略组部分
;==================================================

;========================
; 核心策略组
;========================
custom_proxy_group=手动选择`select`[]♻️ 自动选择[]全球直连
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50

;========================
; 功能分流组
;========================
custom_proxy_group=PikPak`select`[]手动选择[]♻️ 自动选择[]全球直连
custom_proxy_group=ChatGPT`select`[]手动选择[]♻️ 自动选择
custom_proxy_group=GitHub`select`[]手动选择[]♻️ 自动选择[]全球直连
custom_proxy_group=YouTube`select`[]手动选择[]♻️ 自动选择
custom_proxy_group=Netflix`select`[]手动选择[]♻️ 自动选择
custom_proxy_group=Spotify`select`[]手动选择[]♻️ 自动选择[]全球直连

;========================
; 默认兜底组
;========================
custom_proxy_group=漏网之鱼`select`[]手动选择[]♻️ 自动选择[]全球直连
